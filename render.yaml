services:
  - type: web
    name: cogo-admin-page
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 6543
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DATABASE
        sync: false
      - key: DB_SSLMODE
        value: require
